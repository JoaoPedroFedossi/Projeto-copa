<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Projeto Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-copa">
        <div class="container">
            <div class="navbar-inner w-100">
                <a class="navbar-brand" th:href="@{/home}">Projeto Copa</a>
                <div class="nav-tabs-copa">
                    <a class="nav-link-copa active" th:href="@{/home}">Home</a>
                    <a class="nav-link-copa" th:href="@{/gacha}">Gacha</a>
                    <a class="nav-link-copa" th:href="@{/inventario}">Inventário</a>
                </div>
                <div class="navbar-right">
                    <span class="badge-gemas" th:if="${gemas != null}" th:text="${gemas} + ' gemas'">0 gemas</span>
                    <span class="text-muted-copa d-none d-md-inline" style="font-size:0.8rem;" th:if="${nomeUsuario != null}" th:text="'Olá, ' + ${nomeUsuario}"></span>
                    <a class="btn btn-copa btn-sm" th:href="@{/logout}">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center mb-5">
            <p class="mb-3" style="font-size:0.9rem;color:var(--muted);">
                <span class="status-dot"></span>Copa 2026 · colecione jogadores
            </p>
            <h1 class="title-champ display-5 mb-2">Locker Room</h1>
            <p class="text-muted-copa">Escolha uma opção abaixo</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/gacha}" class="menu-card menu-gacha">
                    <span style="font-size:1.8rem;">📦</span>
                    Gacha
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/inventario}" class="menu-card menu-inventario">
                    <span style="font-size:1.8rem;">🃏</span>
                    Inventário
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
