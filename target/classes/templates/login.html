<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="copa-card p-4 p-md-5 w-100" style="max-width: 420px;">
            <p class="subtitle-mono text-center mb-2">Projeto Copa</p>
            <h1 class="h3 text-center title-champ mb-1">Entrar</h1>
            <p class="text-center text-muted-copa mb-4" style="font-size:0.9rem;">Entre com seu nome e senha</p>

            <div th:if="${erro}" class="alert alert-copa-erro" th:text="${erro}"></div>
            <div th:if="${sucesso}" class="alert alert-copa-sucesso" th:text="${sucesso}"></div>

            <form method="post" th:action="@{/login}" class="">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control form-control-copa" id="nome" name="nome"
                           required autofocus placeholder="Seu nome de usuário">
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control form-control-copa" id="senha" name="senha"
                           required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn btn-copa btn-copa-gold w-100 py-2">Entrar</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1" style="font-size:0.9rem;">
                    Não tem conta? <a th:href="@{/cadastro}" class="link-copa">Cadastre-se</a>
                </p>
                <small class="text-muted-copa">Administrador: entre usando a conta ADMIN.</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
