<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Projeto Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-copa">
        <div class="container">
            <div class="navbar-inner w-100">
                <a class="navbar-brand" th:href="@{/home}">Projeto Copa</a>
                <div class="nav-tabs-copa">
                    <a class="nav-link-copa" th:href="@{/home}">Home</a>
                    <a class="nav-link-copa" th:href="@{/gacha}">Gacha</a>
                    <a class="nav-link-copa" th:href="@{/inventario}">Inventário</a>
                    <a class="nav-link-copa active" th:href="@{/admin}">Admin</a>
                </div>
                <div class="navbar-right">
                    <span class="badge-gemas" th:if="${gemas != null}" th:text="${gemas} + ' gemas'">0 gemas</span>
                    <span class="text-muted-copa d-none d-md-inline" style="font-size:0.8rem;" th:if="${nomeUsuario != null}" th:text="'Olá, ' + ${nomeUsuario}"></span>
                    <a class="btn btn-copa btn-sm" th:href="@{/logout}">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div th:if="${sucesso}" class="alert alert-copa-sucesso" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-copa-erro" th:text="${erro}"></div>

        <div class="copa-card p-3 p-md-4">
            <p class="title-gold mb-1">Admin</p>
            <h2 class="h5 title-champ mb-3">Usuários cadastrados</h2>

            <div class="table-responsive">
                <table class="table table-copa table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Perfil</th>
                            <th>Gemas</th>
                            <th style="min-width: 120px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUsuario}"></td>
                            <td th:text="${u.nome}"></td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${u.perfil == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                                      th:text="${u.perfil}">USER</span>
                            </td>
                            <td>
                                <form class="d-flex gap-2 align-items-center" method="post"
                                      th:action="@{/admin/usuario/{id}/gemas(id=${u.idUsuario})}">
                                    <input type="number" min="0" name="gemas" th:value="${u.gemas}"
                                           required class="form-control form-control-copa form-control-sm"
                                           style="width: 90px;">
                                    <button type="submit" class="btn btn-copa btn-sm">Salvar</button>
                                </form>
                            </td>
                            <td>
                                <form method="post"
                                      th:action="@{/admin/usuario/{id}/excluir(id=${u.idUsuario})}"
                                      onsubmit="return confirm('Excluir este usuário?')">
                                    <button type="submit" class="btn btn-copa-danger btn-sm"
                                            th:disabled="${u.perfil == 'ADMIN'}">
                                        Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
